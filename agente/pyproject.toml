[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-central-de-salas"
version = "1.0.0"
description = "Agente A2A da Central de Salas, com um host MCP por dentro. Sem LLM."
requires-python = ">=3.10"
dependencies = [
    "httpx2==2.16.2",
    "mcp==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
agente = "agente.__main__:main"

[tool.setuptools]
packages = ["agente"]
